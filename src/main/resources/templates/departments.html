<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
</head>
<body>
    <h2>Departments</h2>
    
    <p>Logged in as: <span sec:authentication="name"></span> | 
       Role: <span sec:authentication="principal.authorities"></span> |
       <a th:href="@{/logout}">Logout</a>
    </p>
    
    <nav>
        <a th:href="@{/students}">Students</a> | 
        <a th:href="@{/departments}">Departments</a> | 
        <a th:href="@{/courses}">Courses</a>
    </nav>
    
    <hr/>
    
    <!-- Only TEACHER and AUTHORITY can add departments -->
    <div sec:authorize="hasAnyRole('TEACHER', 'AUTHORITY')">
        <a th:href="@{/departments/add}">Add New Department</a>
    </div>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th sec:authorize="hasAnyRole('TEACHER', 'AUTHORITY')">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="department : ${departments}">
                <td th:text="${department.id}"></td>
                <td th:text="${department.name}"></td>
                <td th:text="${department.description}"></td>
                <td sec:authorize="hasAnyRole('TEACHER', 'AUTHORITY')">
                    <a th:href="@{/departments/edit/{id}(id=${department.id})}">Edit</a> | 
                    <a th:href="@{/departments/delete/{id}(id=${department.id})}" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
