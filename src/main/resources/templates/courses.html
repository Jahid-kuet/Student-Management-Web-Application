<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
</head>
<body>
    <h2>Courses</h2>
    
    <p>Logged in as: <span sec:authentication="name"></span> | 
       Role: <span sec:authentication="principal.authorities"></span> |
       <a th:href="@{/logout}">Logout</a>
    </p>
    
    <nav>
        <a th:href="@{/students}">Students</a> | 
        <a th:href="@{/departments}">Departments</a> | 
        <a th:href="@{/courses}">Courses</a>
    </nav>
    
    <hr/>
    
    <!-- Only AUTHORITY can add courses -->
    <div sec:authorize="hasRole('AUTHORITY')">
        <a th:href="@{/courses/add}">Add New Course</a>
    </div>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Code</th>
                <th>Name</th>
                <th>Description</th>
                <th>Credits</th>
                <th sec:authorize="hasAnyRole('TEACHER', 'AUTHORITY')">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.id}"></td>
                <td th:text="${course.code}"></td>
                <td th:text="${course.name}"></td>
                <td th:text="${course.description}"></td>
                <td th:text="${course.credits}"></td>
                <td sec:authorize="hasAnyRole('TEACHER', 'AUTHORITY')">
                    <a th:href="@{/courses/edit/{id}(id=${course.id})}">Edit</a>
                    <span sec:authorize="hasRole('AUTHORITY')">
                        | <a th:href="@{/courses/delete/{id}(id=${course.id})}" onclick="return confirm('Are you sure?')">Delete</a>
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
